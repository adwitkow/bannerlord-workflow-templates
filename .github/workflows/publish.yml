name: Publish

on:
  workflow_call:
    inputs:
      nexus_file_id:
        description: "Nexus Mods file ID to add the new version to. Leave empty to skip the Nexus upload"
        type: string
        required: false
        default: ""
      nexus_mod_id:
        description: "Nexus Mods mod ID. Required for the changelog to be sent"
        type: string
        required: false
        default: ""
      nexus_category:
        description: "Category for the uploaded file version"
        type: string
        required: false
        default: "main"
      nexus_archive_existing_version:
        description: "Archive the existing version when uploading a new version"
        type: boolean
        required: false
        default: false
      nexus_primary_mod_manager_download:
        description: "Whether this file is the default download for mod managers"
        type: boolean
        required: false
        default: true
      nexus_allow_mod_manager_download:
        description: "Whether mod manager downloads are enabled for this file"
        type: boolean
        required: false
        default: true
      nexus_show_requirements_pop_up:
        description: "Whether to show a requirements popup when downloading this file"
        type: boolean
        required: false
        default: true
      nexus_update_mod_version:
        description: "Whether to update the mod's version to match this file's version"
        type: boolean
        required: false
        default: true
    secrets:
      NEXUSMODS_API_KEY:
        description: "Nexus Mods API key. Required only when nexus_file_id is set"
        required: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    env:
      NEXUS_ENABLED: ${{ inputs.nexus_file_id != '' }}

    steps:
      - name: Validate Nexus configuration
        if: ${{ env.NEXUS_ENABLED == 'true' }}
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "::error::nexus_file_id is set but the NEXUSMODS_API_KEY secret was not provided to this workflow."
            exit 1
          fi

      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.workflow_run.head_branch }}"
          VERSION=v${VERSION#release/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "number=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Download build artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            --name Build \
            --dir ./artifact

      - name: Create archive
        run: |
          cd artifact
          zip -r "${{ github.event.repository.name }}.${{ steps.version.outputs.version }}.zip" .

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          echo "## Changes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -z "$PREV_TAG" ]; then
            git log --no-merges --oneline --no-decorate --pretty=format:"- %s - %an (%h)" >> RELEASE_NOTES.md
          else
            git log ${PREV_TAG}..HEAD \
              --no-merges --oneline --no-decorate --pretty=format:"- %s - %an (%h)" >> RELEASE_NOTES.md
          fi

      - name: Prepare Nexus description and changelog
        id: nexus_meta
        if: ${{ env.NEXUS_ENABLED == 'true' }}
        env:
          NEXUS_MOD_ID: ${{ inputs.nexus_mod_id }}
        run: |
          # Release notes without the heading and leading hyphens
          NOTES=$(tail -n +3 RELEASE_NOTES.md | sed 's/^- //')

          # Supported game versions collapsed to major.minor.x
          VERSIONS_LINE=""
          if [ -f supported-game-versions.txt ]; then
            RANGES=$(tr -d '\r' < supported-game-versions.txt | awk '
              NF {
                v = $1
                sub(/^[vV]/, "", v)
                n = split(v, p, ".")
                s = (n >= 2) ? p[1] "." p[2] ".x" : v
                if (!(s in seen)) {
                  seen[s] = 1
                  out = out (out == "" ? "" : ", ") s
                }
              }
              END { print out }')
            if [ -n "$RANGES" ]; then
              VERSIONS_LINE="Supported game versions: $RANGES"
            fi
          else
            echo "::warning::supported-game-versions.txt not found; description will contain release notes only."
          fi

          # Description = versions line + blank line + release notes
          DESCRIPTION="$VERSIONS_LINE"
          if [ -n "$NOTES" ]; then
            DESCRIPTION="${DESCRIPTION:+$DESCRIPTION$'\n\n'}$NOTES"
          fi

          {
            echo 'description<<NEXUS_DESCRIPTION_EOF'
            printf '%s\n' "$DESCRIPTION"
            echo 'NEXUS_DESCRIPTION_EOF'
          } >> "$GITHUB_OUTPUT"

          # Changelog (only sent when mod_id is set)
          if [ -n "$NEXUS_MOD_ID" ]; then
            {
              echo 'changelog<<NEXUS_CHANGELOG_EOF'
              printf '%s\n' "$NOTES"
              echo 'NEXUS_CHANGELOG_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Nexus Mods
        if: ${{ env.NEXUS_ENABLED == 'true' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.nexus_file_id }}
          filename: artifact/${{ github.event.repository.name }}.${{ steps.version.outputs.version }}.zip
          display_name: ${{ github.event.repository.name }}.${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.number }}
          description: ${{ steps.nexus_meta.outputs.description }}
          category: ${{ inputs.nexus_category }}
          archive_existing_version: ${{ inputs.nexus_archive_existing_version }}
          primary_mod_manager_download: ${{ inputs.nexus_primary_mod_manager_download }}
          allow_mod_manager_download: ${{ inputs.nexus_allow_mod_manager_download }}
          show_requirements_pop_up: ${{ inputs.nexus_show_requirements_pop_up }}
          update_mod_version: ${{ inputs.nexus_update_mod_version }}
          mod_id: ${{ inputs.nexus_mod_id }}
          changelog: ${{ steps.nexus_meta.outputs.changelog }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            ./artifact/${{ github.event.repository.name }}.${{ steps.version.outputs.version }}.zip \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md
